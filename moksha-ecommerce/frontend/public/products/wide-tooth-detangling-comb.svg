<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="wide-tooth-detangling-comb">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#EDEBE7"/>
      <stop offset="1" stop-color="#DFDBD3"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.10"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="drop" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1a1917" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="800" height="1000" fill="url(#ground)"/>
  <rect width="800" height="1000" fill="url(#halo)"/>

  <!-- The contact shadow. Without one the product floats, which is the single
       thing that most makes a flat illustration look unfinished. -->
  <ellipse cx="400" cy="792" rx="150" ry="20" fill="#1a1917" opacity="0.12"/>

  <g filter="url(#drop)">
    
    <rect x="236" y="356" width="328" height="86" rx="20" fill="#9A7B57"/>
    <rect x="236" y="356" width="328" height="86" rx="20" fill="url(#sheen)"/>
    <rect x="250" y="430" width="14" height="230" rx="7" fill="#7A6044"/><rect x="280" y="430" width="14" height="230" rx="7" fill="#7A6044"/><rect x="310" y="430" width="14" height="230" rx="7" fill="#7A6044"/><rect x="340" y="430" width="14" height="230" rx="7" fill="#7A6044"/><rect x="370" y="430" width="14" height="230" rx="7" fill="#7A6044"/><rect x="400" y="430" width="14" height="230" rx="7" fill="#7A6044"/><rect x="430" y="430" width="14" height="230" rx="7" fill="#7A6044"/><rect x="460" y="430" width="14" height="230" rx="7" fill="#7A6044"/><rect x="490" y="430" width="14" height="230" rx="7" fill="#7A6044"/><rect x="520" y="430" width="14" height="230" rx="7" fill="#7A6044"/><rect x="550" y="430" width="14" height="230" rx="7" fill="#7A6044"/>
    <rect x="286" y="386" width="120" height="7" rx="3.5" fill="#1f5a45" opacity="0.3"/>
  </g>
</svg>
