<!doctype html>
<!-- data-theme="light" pins the storefront to the light palette.
     The token layer supports both and follows the OS by default; this is a product decision, not
     a technical one — a shop should look the same to everyone, and the warm-paper palette is the
     brand. The dark tokens stay in theme.css because this attribute is the entire switch: adding
     a theme toggle later is a line of state, not a redesign. -->
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Matches data-theme above. Without it the browser paints a dark canvas for a moment before
         the stylesheet lands, and form controls and scrollbars render dark. -->
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="Moksha — haircare, honestly made. A technical assignment demonstrating Google sign-in, Stripe payments and an AI support agent."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- preconnect before the stylesheet: the font files come from a second
         origin, and opening that connection early removes a serial DNS + TLS
         round trip from the critical path. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <title>Moksha — Haircare</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
